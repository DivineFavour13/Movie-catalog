<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./movie-catalog-logo.svg" />
    <link rel="apple-touch-icon" href="./movie-catalog-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Catalog</title>
    <style>
      body {
        margin: 0;
        background: #0b0b0d;
      }

      .app-loader {
        min-height: 100vh;
        display: grid;
        place-items: center;
        color: #ffffff;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      .app-loader__mark {
        width: 64px;
        height: 64px;
        animation: app-loader-pulse 1.4s ease-in-out infinite;
      }

      .app-loader__brand {
        margin-top: 14px;
        font-size: 0.95rem;
        font-weight: 700;
        letter-spacing: 0;
      }

      @keyframes app-loader-pulse {
        0%,
        100% {
          opacity: 0.72;
          transform: scale(0.96);
        }

        50% {
          opacity: 1;
          transform: scale(1);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-loader" aria-label="Loading MovieCatalog">
        <div>
          <img
            class="app-loader__mark"
            src="./movie-catalog-logo.svg"
            alt="MovieCatalog"
          />
          <div class="app-loader__brand">MovieCatalog</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
